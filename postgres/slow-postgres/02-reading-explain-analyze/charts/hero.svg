<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40" y="66" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" fill="#0B0B0B" font-weight="500" text-anchor="start">Read the plan from the bottom up</text><text x="40" y="116" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" fill="#505050" font-weight="400" text-anchor="start">The report query, rows per node: what the planner</text><text x="40" y="154" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" fill="#505050" font-weight="400" text-anchor="start">expected and what EXPLAIN ANALYZE counted</text><text x="650" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#505050" font-weight="400" text-anchor="end">expected</text><text x="960" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#505050" font-weight="400" text-anchor="end">got</text><text x="120" y="290" font-family="Menlo, SFMono-Regular, monospace" font-size="31" fill="#0B0B0B" font-weight="400" text-anchor="start">Sort</text><text x="650" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#505050" font-weight="400" text-anchor="end">4</text><text x="960" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#0B0B0B" font-weight="400" text-anchor="end">4</text><line x1="132" y1="360" x2="132" y2="378" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/><line x1="132" y1="378" x2="146" y2="378" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/><text x="154" y="390" font-family="Menlo, SFMono-Regular, monospace" font-size="31" fill="#0B0B0B" font-weight="400" text-anchor="start">GroupAggregate</text><text x="650" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#505050" font-weight="400" text-anchor="end">4</text><text x="960" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#0B0B0B" font-weight="400" text-anchor="end">4</text><line x1="166" y1="460" x2="166" y2="478" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/><line x1="166" y1="478" x2="180" y2="478" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/><text x="188" y="490" font-family="Menlo, SFMono-Regular, monospace" font-size="31" fill="#0B0B0B" font-weight="700" text-anchor="start">Sort</text><text x="650" y="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#505050" font-weight="400" text-anchor="end">1,500</text><text x="960" y="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#0B0B0B" font-weight="700" text-anchor="end">75,000</text><line x1="200" y1="560" x2="200" y2="578" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/><line x1="200" y1="578" x2="214" y2="578" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/><text x="222" y="590" font-family="Menlo, SFMono-Regular, monospace" font-size="31" fill="#0B0B0B" font-weight="700" text-anchor="start">Nested Loop</text><text x="650" y="590" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#505050" font-weight="400" text-anchor="end">1,500</text><text x="960" y="590" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#0B0B0B" font-weight="700" text-anchor="end">75,000</text><rect x="78" y="642" width="904" height="88" rx="10" fill="#C6F94A" opacity="0.45"/><line x1="234" y1="660" x2="234" y2="678" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/><line x1="234" y1="678" x2="248" y2="678" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/><text x="256" y="690" font-family="Menlo, SFMono-Regular, monospace" font-size="31" fill="#0B0B0B" font-weight="700" text-anchor="start">Seq Scan users</text><text x="650" y="690" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#505050" font-weight="400" text-anchor="end">300</text><text x="960" y="690" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#0B0B0B" font-weight="700" text-anchor="end">15,000</text><line x1="234" y1="760" x2="234" y2="778" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/><line x1="234" y1="778" x2="248" y2="778" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/><text x="256" y="790" font-family="Menlo, SFMono-Regular, monospace" font-size="31" fill="#0B0B0B" font-weight="400" text-anchor="start">Index Scan orders</text><text x="650" y="790" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#505050" font-weight="400" text-anchor="end">5</text><text x="960" y="790" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#0B0B0B" font-weight="400" text-anchor="end">5</text><text x="960" y="826" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#0B0B0B" font-weight="700" text-anchor="end">× 15,000 loops</text><line x1="46" y1="810" x2="46" y2="260" stroke="#0B0B0B" stroke-width="3" marker-end="url(#arr)" stroke-linecap="round"/><text x="40" y="902" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="400" text-anchor="start">The first node where the guess is off by 50x is the</text><text x="40" y="940" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="400" text-anchor="start">one to fix. Every node above it was planned around 300.</text>
