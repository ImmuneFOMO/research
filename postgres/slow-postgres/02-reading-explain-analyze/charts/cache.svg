<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40" y="66" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" fill="#0B0B0B" font-weight="500" text-anchor="start">The wrong guess wins warm</text><text x="40" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" fill="#0B0B0B" font-weight="500" text-anchor="start">and loses from disk</text><text x="40" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#505050" font-weight="400" text-anchor="start">Same report, same 75,000 rows, plain query time,</text><text x="40" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#505050" font-weight="400" text-anchor="start">median of 5 to 7 runs on a 4 vCPU cloud VM</text><rect x="40" y="244" width="26" height="26" rx="3" fill="#0B0B0B" stroke="#0B0B0B" stroke-width="0"/><text x="80" y="266" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#505050" font-weight="400" text-anchor="start">Nested Loop: the plan for a guess of 300 users</text><rect x="40" y="284" width="26" height="26" rx="3" fill="#C6F94A" stroke="#0B0B0B" stroke-width="2"/><text x="80" y="306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#505050" font-weight="400" text-anchor="start">Hash Join: the plan when the guess is 15,000</text><text x="40" y="382" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="400" text-anchor="start">in shared_buffers</text><rect x="40" y="400" width="44.17240793469391" height="40" rx="3" fill="#0B0B0B" stroke="#0B0B0B" stroke-width="0"/><text x="98.17240793469391" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="700" text-anchor="start">159 ms</text><rect x="40" y="450" width="95.6976000401061" height="40" rx="3" fill="#C6F94A" stroke="#0B0B0B" stroke-width="2"/><text x="149.6976000401061" y="480" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="400" text-anchor="start">344 ms</text><text x="40" y="572" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="400" text-anchor="start">Postgres restarted, pages in the OS cache</text><rect x="40" y="590" width="84.73833093656087" height="40" rx="3" fill="#0B0B0B" stroke="#0B0B0B" stroke-width="0"/><text x="138.73833093656089" y="620" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="700" text-anchor="start">304 ms</text><rect x="40" y="640" width="95.21855501080172" height="40" rx="3" fill="#C6F94A" stroke="#0B0B0B" stroke-width="2"/><text x="149.2185550108017" y="670" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="400" text-anchor="start">342 ms</text><text x="40" y="762" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="700" text-anchor="start">restarted and OS cache dropped: from disk</text><rect x="40" y="780" width="600" height="40" rx="3" fill="#0B0B0B" stroke="#0B0B0B" stroke-width="0"/><text x="654" y="810" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="700" text-anchor="start">2.15 s</text><text x="624" y="810" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#FFFFFF" font-weight="400" text-anchor="end">41,801 pages read</text><rect x="40" y="830" width="126.59683997389389" height="40" rx="3" fill="#C6F94A" stroke="#0B0B0B" stroke-width="2"/><text x="180.5968399738939" y="860" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#0B0B0B" font-weight="400" text-anchor="start">455 ms, 46,535 pages read</text>
</svg>